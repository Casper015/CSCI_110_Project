name: C++ CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C++ targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          sources=(
            "ATM_Casper.cpp"
            "ATM/main.cpp"
            "ATM/test.cpp"
            "ATM/output/sample.cpp"
            ".vscode/exam.cpp"
            "Email/Mailv1.cpp"
            "Email/Mailv2.cpp"
          )

          for source in "${sources[@]}"; do
            output="${source//\//_}"
            output="${output%.cpp}"
            echo "Compiling ${source} -> build/${output}"
            g++ -std=c++17 "${source}" -o "build/${output}"
          done

      - name: Upload build artifacts (CD)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cpp-build-binaries
          path: build/
